
workflows:
  income-expenses-android:
    name: Income & Expenses Android APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Check and prepare Flutter project
        script: |
          set -e

          echo "Checking project files..."
          test -f pubspec.yaml
          test -f lib/main.dart

          echo "Checking Android folder..."
          if [ ! -d android ]; then
            echo "Generating missing Android files..."
            flutter create --platforms=android --project-name income_expenses --org com.example .
          fi

          test -f android/gradlew
          echo "Android folder is ready."

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Analyze code
        script: |
      - flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
