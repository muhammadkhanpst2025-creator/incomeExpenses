
workflows:
  income-expenses-android:
    name: Income & Expenses Android APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Check Flutter project
        script: |
          echo "Checking Flutter project files..."
          test -f pubspec.yaml || (echo "ERROR: pubspec.yaml missing" && exit 1)
          test -f lib/main.dart || (echo "ERROR: lib/main.dart missing" && exit 1)
          test -d android || (echo "ERROR: android folder missing. This must be a complete Flutter project." && exit 1)

      - name: Install dependencies
        script: flutter pub get

      - name: Analyze code
        script: flutter analyze

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
