workflows:
  sahil-khata-android:
    name: Income and Expenses Android APK
    max_build_duration: 60
    working_directory: "incomeExpenses"
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: flutter create --platforms=android --project-name=income_and_expenses .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Dart source
        script: flutter analyze
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log
