workflows:
  income-expenses-android:
    name: Income & Expenses Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project if missing
        script: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name income_expenses --org com.sahiljanwery .
          fi
      - name: Install dependencies and generate launcher icon
        script: |
          set -e
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze source
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
